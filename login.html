<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineClub - Iniciar Sesión</title>
    <!-- Vincular el archivo CSS para estilos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Encabezado: Logotipo o nombre del sitio web -->
    <header>
        <div class="logo">
            <h1>🎬 CineClub</h1>
        </div>
    </header>

    <!-- Contenido principal: Formulario de acceso -->
    <main class="login-container">
        <section class="login-card">
            <h2>¡Hola de nuevo, cinéfilo!</h2>
            <p>Ingresa tus datos para acceder a tu catálogo favorito</p>

            <form action="#">
                <!-- Campo para Correo Electrónico -->
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <!-- Campo para Contraseña -->
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
                </div>

                <!-- Botón para enviar el formulario -->
                <button type="submit" class="btn-submit">Ingresar</button>
            </form>

            <!-- Enlace para navegar hacia otra página del sitio (Bienvenida) -->
            <p class="switch-page">
                ¿No tienes cuenta? <a href="bienvenida.html">Entrar como invitado</a>
            </p>
        </section>
    </main>

    <!-- Pie de página -->
    <footer>
        <p>&copy; 2026 CineClub. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
